# Docker's built-in DNS lives at 127.0.0.11.
# valid=5s makes NGINX re-resolve "app" every 5 seconds,
# so containers that are added or removed are noticed automatically.
resolver 127.0.0.11 valid=5s ipv6=off;

log_format lb '$remote_addr "$request" status=$status upstream=$upstream_addr rt=$request_time';
access_log /var/log/nginx/access.log lb;

server {
    listen 80;

    location / {
        # Using a variable forces NGINX to resolve the name at request time,
        # not only once at startup.
        set $backend http://app:8000;
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # If one instance is down, quickly try another.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }
}